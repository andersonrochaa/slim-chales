# Publica a versão de teste do site no GitHub Pages a cada push na main.
# Endereço: https://<usuário>.github.io/<repositório>/
# Na primeira vez: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # O Pages só serve arquivos estáticos: a rota de servidor do formulário fica de fora.
      - name: Remover a rota /api/contato
        run: rm -rf src/pages/api

      - name: Gerar o site
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          PUBLIC_DEMO: 'true'
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
